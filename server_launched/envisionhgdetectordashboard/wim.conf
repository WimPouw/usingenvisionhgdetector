<VirtualHost _default_:80>
   DocumentRoot /data/www/wimpouw/web
   ServerName tsg-131-174-75-200.hosting.ru.nl
   ErrorLog ${APACHE_LOG_DIR}/wim80-error.log
   ServerAlias karnatak.tsg-131-174-75-200.hosting.ru.nl  # Add this line
   ServerAlias dynamicvisualizer.tsg-131-174-75-200.hosting.ru.nl  # Add this line
   ServerAlias dimsvisualizer.tsg-131-174-75-200.hosting.ru.nl  # Add this line
   ServerAlias proprioception.tsg-131-174-75-200.hosting.ru.nl  # Add this line
   ServerAlias envisionhgdetectordashboard.tsg-131-174-75-200.hosting.ru.nl  # Add this line
   CustomLog ${APACHE_LOG_DIR}/wim80-access.log combined 
RewriteEngine on
RewriteCond %{SERVER_NAME} =tsg-131-174-75-200.hosting.ru.nl
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
	<VirtualHost _default_:443>
		ServerAdmin maarten.snellen@ru.nl
                ServerName tsg-131-174-75-200.hosting.ru.nl
		DocumentRoot /data/www/wimpouw/web
		ErrorLog ${APACHE_LOG_DIR}/wim443-error.log
		CustomLog ${APACHE_LOG_DIR}/wim443-access.log combined

		SSLEngine on

		<FilesMatch "\.(cgi|shtml|phtml|php)$">
				SSLOptions +StdEnvVars
				SetHandler "proxy:unix:/run/php/php8.0-fpm.sock|fcgi://localhost"
		</FilesMatch>
		<Directory /usr/lib/cgi-bin>
				SSLOptions +StdEnvVars
		</Directory>
		
##		WSGIApplicationGroup %{GLOBAL}		

		WSGIDaemonProcess siamang processes=1 python-path=/data/home/wimpouw/.local/lib/python3.8/site-packages
		WSGIScriptAlias /siamang /data/www/wimpouw/web/siamang/app.wsgi
		<Directory /data/www/wimpouw/web/siamang>
			WSGIProcessGroup siamang
			WSGIApplicationGroup %{GLOBAL}
			Require all granted
		</Directory>

		WSGIDaemonProcess karnatak processes=1 python-path=/data/home/wimpouw/.local/lib/python3.8/site-packages
		WSGIScriptAlias /karnatak /data/www/wimpouw/web/karnatak/app2.wsgi
		<Directory /data/www/wimpouw/web/karnatak>
			WSGIProcessGroup karnatak
			WSGIApplicationGroup %{GLOBAL}
			Require all granted
		</Directory>

		WSGIDaemonProcess dynamicvisualizer processes=1 python-path=/data/home/wimpouw/.local/lib/python3.8/site-packages
		WSGIScriptAlias /dynamicvisualizer /data/www/wimpouw/web/dynamicvisualizer/app3.wsgi
		<Directory /data/www/wimpouw/web/dynamicvisualizer>
			WSGIProcessGroup dynamicvisualizer
			WSGIApplicationGroup %{GLOBAL}
			Require all granted
		</Directory>

		WSGIDaemonProcess dimsvisualizer processes=1 python-path=/data/home/wimpouw/.local/lib/python3.8/site-packages
		WSGIScriptAlias /dimsvisualizer /data/www/wimpouw/web/dimsvisualizer/app4.wsgi
		<Directory /data/www/wimpouw/web/dimsvisualizer>
			WSGIProcessGroup dimsvisualizer
			WSGIApplicationGroup %{GLOBAL}
			Require all granted
			AddType video/mp4 .mp4
			AddType video/webm .webm
		</Directory>

		WSGIDaemonProcess proprioception processes=1 python-path=/data/home/wimpouw/.local/lib/python3.8/site-packages
		WSGIScriptAlias /proprioception /data/www/wimpouw/web/proprioception/app5.wsgi
		<Directory /data/www/wimpouw/web/proprioception>
			WSGIProcessGroup proprioception
			WSGIApplicationGroup %{GLOBAL}
			Require all granted
		</Directory>

                WSGIDaemonProcess envisionhgdetectordashboard processes=1 python-path=/data/home/wimpouw/.local/lib/python3.8/site-packages
		WSGIScriptAlias /envisionhgdetectordashboard /data/www/wimpouw/web/envisionhgdetectordashboard/app6.wsgi
		<Directory /data/www/wimpouw/web/envisionhgdetectordashboard>
			WSGIProcessGroup envisionhgdetectordashboard
			WSGIApplicationGroup %{GLOBAL}
			Require all granted
			AddType video/mp4 .mp4
			AddType video/webm .webm
		</Directory>
		
		SSLCertificateFile /etc/letsencrypt/live/tsg-131-174-75-200.hosting.ru.nl/fullchain.pem
		SSLCertificateKeyFile /etc/letsencrypt/live/tsg-131-174-75-200.hosting.ru.nl/privkey.pem
		Include /etc/letsencrypt/options-ssl-apache.conf
	</VirtualHost>
</IfModule>

